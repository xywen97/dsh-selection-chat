# dsh-selection-chat —— 插件自带的挂载声明。
#
# 装法（任选其一）：
#   dsh plugin --profile desktop add dsh-selection-chat
#   dsh plugin --profile desktop add "git+https://github.com/xywen97/dsh-selection-chat.git"
#
# host 半端为空；功能全在 client.js：选中文字 → 浮条「加入对话 / 侧边提问 / 评论」。
- insert:
    - id: selection-chat
      name: dsh-selection-chat
      config: {}
